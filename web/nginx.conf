server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # "backend" is the docker-compose service name -- Docker's internal DNS
    # resolves it to the backend container. Mirrors the Vite dev proxy
    # (vite.config.ts) that only exists in `npm run dev`, not in this
    # production static build.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
