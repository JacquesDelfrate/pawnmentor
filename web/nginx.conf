server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Needed because nginx otherwise resolves
    # upstream hostnames once at startup and caches the IP forever -- so
    # recreating the backend container (any `docker compose up` after a code
    # change) would leave this proxy 502-ing against a dead IP until the
    # frontend was manually restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # "backend" is the docker-compose service name. Passing it through a
    # variable is what forces nginx to re-resolve per request rather than
    # pinning the startup IP. Mirrors the Vite dev proxy (vite.config.ts),
    # which only exists in `npm run dev`, not in this production build.
    location /api/ {
        set $backend_upstream http://backend:8000;
        # A variable in proxy_pass disables nginx's automatic prefix
        # stripping, so /api/ has to be removed explicitly here to keep
        # /api/health -> /health.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
