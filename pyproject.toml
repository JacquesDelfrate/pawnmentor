[project]
name = "chess"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.10",
    "openai>=2.52.0",
    "python-chess>=1.2.0",
    "requests>=2.34.2",
    "sqlmodel>=0.0.39",
    "stockfish>=5.2.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["chess_advisor.py", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "engine: requires a local Stockfish binary via STOCKFISH_PATH",
]
